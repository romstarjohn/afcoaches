{% load i18n static %}<!doctype html>
{% get_current_language as LANGUAGE_CODE %}
<html lang="{{ LANGUAGE_CODE }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Coach sur mesure{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/base.css' %}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{% url 'core:home' %}">Coach sur mesure</a>
    <form class="lang-switch" action="{% url 'set_language' %}" method="post">
      {% csrf_token %}
      <input name="next" type="hidden" value="{{ request.get_full_path }}">
      <label for="language" class="visually-hidden">{% translate "Language" %}</label>
      <select id="language" name="language" onchange="this.form.submit()">
        {% get_available_languages as LANGUAGES %}
        {% get_language_info_list for LANGUAGES as languages %}
        {% for language in languages %}
          <option value="{{ language.code }}"{% if language.code == LANGUAGE_CODE %} selected{% endif %}>
            {{ language.name_local|capfirst }}
          </option>
        {% endfor %}
      </select>
      <noscript><button type="submit">{% translate "Change" %}</button></noscript>
    </form>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
