name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: coach
          POSTGRES_PASSWORD: coach
          POSTGRES_DB: coachsurmesure
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U coach" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://coach:coach@localhost:5432/coachsurmesure
      DJANGO_DEBUG: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: sudo apt-get update && sudo apt-get install -y gettext
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Translations compile
        run: python manage.py compilemessages
      - name: Missing migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Tests
        run: pytest
      - name: Deploy checklist
        env:
          DJANGO_DEBUG: "false"
          DJANGO_SECRET_KEY: ci-only-${{ github.run_id }}-not-a-real-secret-value-0123456789abcdef
          DJANGO_ALLOWED_HOSTS: example.invalid
        run: python manage.py check --deploy --fail-level WARNING
