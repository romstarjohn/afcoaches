[project]
name = "coachsurmesure"
version = "0.1.0"
description = "Multi-coach fitness and nutrition platform for people with a West African background"
requires-python = ">=3.13"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
    "error",
    # whitenoise warns when collectstatic has not run (expected in local/test runs)
    "ignore:No directory at:UserWarning",
]

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "S", "BLE"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"tools/*" = ["S603"]
